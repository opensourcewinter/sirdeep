name: Security & Code Integrity Sentinel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: 🛡️ Secret & Token Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  sast-scan:
    name: 🔍 Static Application Security Testing (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit ruff

      - name: Run Bandit Security Analysis
        run: |
          bandit -r src/ -ll -ii

      - name: Run Ruff Code Integrity Check
        run: |
          ruff check src/ --select E9,F63,F7,F82
